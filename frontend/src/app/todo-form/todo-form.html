<form [formGroup]="todoForm" (ngSubmit)="onSubmit()">
  <div>
    <input 
      type="text" 
      formControlName="title" 
      placeholder="Title" 
    />
    @if (todoForm.get('title')?.invalid && todoForm.get('title')?.touched) {
      <p class="error-message">Title is required</p>
    }
  </div>

  <textarea 
    formControlName="description" 
    placeholder="Description">
  </textarea>

  <select formControlName="priority">
    <option [ngValue]="1">Low</option>
    <option [ngValue]="2">Medium</option>
    <option [ngValue]="3">High</option>
  </select>

  <button type="submit" [disabled]="todoForm.invalid">
    {{ existingTodo ? 'Update' : 'Create' }}
  </button>
  <button type="button" (click)="cancelEdit()">
    Cancel
  </button>

  @if (errorMessage) {
    <p class="error-message">{{ errorMessage }}</p>
  }
</form>
